name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Si definiste la variable GOOGLE_CLIENT_ID en Settings → Secrets and variables → Actions → Variables,
      # se escribe en config.json al compilar (así no hace falta guardarla en el repositorio).
      - name: Client ID de Google
        if: ${{ vars.GOOGLE_CLIENT_ID != '' }}
        run: echo "{\"googleClientId\": \"${{ vars.GOOGLE_CLIENT_ID }}\"}" > public/config.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
